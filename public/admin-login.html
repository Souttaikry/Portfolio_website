<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Randy Fahmi Portfolio</title>
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="login-screen">
    <form class="login-card" id="loginForm">
      <div class="brand">Admin <span style="color:var(--yellow)">Panel</span></div>
      <div class="sub">Sign in to manage projects & images</div>

      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn">Log in</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>
  </div>

<script>
  // If already logged in, go straight to dashboard
  if (localStorage.getItem('adminToken')) {
    window.location.href = '/admin-dashboard.html';
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.textContent = '';

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (!res.ok) {
        errorMsg.textContent = data.message || 'Login failed';
        return;
      }

      localStorage.setItem('adminToken', data.token);
      localStorage.setItem('adminUsername', data.username);
      window.location.href = '/admin-dashboard.html';
    } catch (err) {
      errorMsg.textContent = 'Could not reach the server.';
    }
  });
</script>
</body>
</html>
